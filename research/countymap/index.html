<!doctype html>
<html lang="en">

    <head>
        <!-- Load general metadata into the site. -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
        <title>Genesee County Healthcare Map</title>
    </head>

    <!-- Import our scripts. -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="countymap.js" defer></script>
    <!-- Load CSS styling. -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/css/bootstrap.min.css" rel="stylesheet"  crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />


    <!-- Include script for automatic header/footer generation -->
    <script src="/headerfooter.js" defer></script>

    <!-- This will be overridden with our header -->
    <header>
        <div id="header"></div>
    </header>

    <main>
        <!-- Begin building main page content. -->
        <section class="py-5 container">
            <!-- Create a row to place the Leaflet map in titled "map". -->
            <div class="row py-lg-1">
                <div id="map"></div>
            </div>

            <!-- Create a row to place all of our controls into. -->
            <div class="row py-lg-4">
                <div class="col-lg-6 col-md-8">

                    <!--
                        Here we build a checkbox titled "controlCheckbox".
                        It will have the text "Simple Mode" displayed alongside it.
                    -->
                    <label class="cbox">
                        <span id="selectedMode">Selected Mode: Simple</span>
                        <input type="checkbox" id="controlButton" checked="checked">
                        <span class="checkmark active"></span>
                    </label>
                </div>

                <div id="controls"></div>
            </div>
        </section>
    </main>

    <footer>
        <section class="py-1 container">
            <div class="row py-lg-4">
                <h3>This page is powered by the following projects:</h3>
                <div>
                    <a href="https://popper.js.org">Popper.js</a> - <a href="https://github.com/vusion/popper.js/blob/master/LICENSE.md">(MIT License)</a>
                </div>
                <div>
                    <a href="https://getbootstrap.com">Bootstrap</a> - <a href="https://github.com/twbs/bootstrap/blob/main/LICENSE">(MIT License)</a>
                </div>
                <div>
                    <a href="https://www.papaparse.com">Papa Parse</a> - <a href="https://github.com/mholt/PapaParse/blob/master/LICENSE">(MIT License)</a>
                </div>
                <div>
                    <a href="https://leafletjs.com">Leaflet</a> - <a href="https://github.com/Leaflet/Leaflet/blob/main/LICENSE">(BSD 2 License)</a>
                </div>
                <div>
                    <a href="https://github.com/Vectorial1024/leaflet-color-markers">Leaflet Color Markers</a> - <a href="https://github.com/Vectorial1024/leaflet-color-markers/blob/master/LICENSE">(BSD 2 License)</a>
                </div>
                <div>
                    <a href="https://www.openstreetmap.org">OpenStreetMap</a> - <a href="https://www.openstreetmap.org/copyright">(ODbL License)</a>
                </div>
            </div>
        </section>

        <div id="footer"></div>
    </footer>
</html>
