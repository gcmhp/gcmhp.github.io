<h3></h3>

<!-- Here we will display the year that is selected. The "selectedYear" element will be replaced by the year.-->
<h3>Selected year: <span id="selectedYear"></span></h3>

<!-- Build a slider that can be set between 1840 and 2025. Title it "yearSelector". -->
<div class="slidecontainer">
    <label for="yearSelector"></label>
    <input type="range" min="1840" max="2025" value="1840" class="slider" id="yearSelector">
</div>

<h4>Please note: This mode selects the closest available map for each location to your selected year.</h4>
<h4>Please unselect the checkbox next to "Simple Mode" above for more advanced controls.</h4>

<div class="mt-3">
    <strong>The following maps are rendered in your selected year:</strong>
    <ul id="activeMapsList" class="mb-0"></ul>
</div>
